server:
  port: 8081
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://192.168.240.10:3306/house-project?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASS:123456}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB
mybatis:
  type-aliases-package: com.example.houseproject.Pojo
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  upload-dir: uploads

logging:
  level:
    root: INFO
    com.example.houseproject: INFO
  file:
    path: ${LOG_PATH:logs}
