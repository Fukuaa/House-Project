<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录失败</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app">
<div class="container">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">HP</div>
            <div>
                <h1>登录失败</h1>
                <p>请检查账号或密码后再试</p>
            </div>
        </div>
    </header>

    <main class="card">

        <p class="muted">账号或密码错误，请重新登录。</p>
        <div class="actions">
            <a class="btn" th:href="@{/}">返回登录</a>
        </div>
    </main>
</div>
</body>
</html>
