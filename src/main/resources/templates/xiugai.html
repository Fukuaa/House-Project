<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('编辑房源')}"></head>
<body>
<header th:replace="~{fragments/shell :: bar('home')}"></header>
<main class="container">
    <section class="sheet">
        <p class="eyebrow">Edit</p>
        <h1>编辑房源</h1>
        <p class="lede">可以改地址、面积、价格和状态。出售和出租的详情不一样，图片保持不变。</p>
        <form th:action="@{/xiugai}" method="post" class="form-grid">
            <div class="field">
                <label>地址</label>
                <input type="text" name="dizhi" th:value="${house.dizhi}">
            </div>
            <div class="field">
                <label>面积（平米）</label>
                <input type="number" name="mianji" th:value="${house.mianji}">
            </div>
            <div class="field">
                <label>价格（元/平米）</label>
                <input type="number" name="jiage" th:value="${house.jiage}">
            </div>
            <div class="field">
                <label>状态</label>
                <select name="zhuangtai" id="status">
                    <option th:each="st : ${statuses}" th:value="${st.label}" th:text="${st.label}"
                            th:selected="${house.zhuangtai == st.label}"></option>
                </select>
            </div>
            <div id="sale-fields" class="detail-fields" th:classappend="${house.zhuangtai == '售卖中'} ? '' : ' is-hidden'">
                <p class="group-label">出售详情</p>
                <div class="field">
                    <label>装修</label>
                    <input type="text" name="zhuangxiu" th:value="${house.zhuangxiu}" placeholder="例如 精装">
                </div>
                <div class="field">
                    <label>产权年限</label>
                    <input type="text" name="chanquan" th:value="${house.chanquan}" placeholder="例如 70 年住宅">
                </div>
                <div class="field">
                    <label>物业费</label>
                    <input type="text" name="wuye" th:value="${house.wuye}" placeholder="例如 3.6 元/平米/月">
                </div>
            </div>
            <div id="rent-fields" class="detail-fields" th:classappend="${house.zhuangtai == '出租中'} ? '' : ' is-hidden'">
                <p class="group-label">出租详情</p>
                <div class="field">
                    <label>家具</label>
                    <input type="text" name="jiaju" th:value="${house.jiaju}" placeholder="例如 全套家具家电">
                </div>
                <div class="field">
                    <label>水电费</label>
                    <input type="text" name="shuidian" th:value="${house.shuidian}" placeholder="例如 租客自理，月均约 200 元">
                </div>
                <div class="field">
                    <label>最低租期</label>
                    <input type="text" name="zuqi" th:value="${house.zuqi}" placeholder="例如 12 个月">
                </div>
            </div>
            <p class="error" th:text="${error}"></p>
            <div class="actions">
                <button class="btn" type="submit">保存</button>
                <a class="btn ghost" th:href="@{/toindex}">返回</a>
            </div>
        </form>
    </section>
</main>
<script src="/js/house-form.js"></script>
</body>
</html>
