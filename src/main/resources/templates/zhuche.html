<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('注册')}"></head>
<body class="gate">
<section class="gate-visual">
    <img src="/images/register-hero.jpg" alt="">
    <div class="gate-caption">
        <p class="eyebrow">Create</p>
        <h1>从一套房子<br>开始。</h1>
    </div>
</section>
<section class="gate-panel">
    <div class="gate-form">
        <p class="eyebrow">Register</p>
        <h2>创建账号</h2>
        <p class="lede">注册完成后回到登录页。</p>
        <form th:action="@{/zhuChe}" method="post" class="form-grid">
            <p class="error" th:text="${name}"></p>
            <div class="field">
                <label>账号</label>
                <input type="text" name="username" autocomplete="username">
            </div>
            <div class="field">
                <label>密码</label>
                <input type="password" name="password" autocomplete="new-password">
            </div>
            <div class="field">
                <label>确认密码</label>
                <input type="password" name="passwordConfirm" autocomplete="new-password">
            </div>
            <button class="btn" type="submit">完成注册</button>
        </form>
        <p class="switch">已有账号？ <a th:href="@{/}">返回登录</a></p>
    </div>
</section>
</body>
</html>
