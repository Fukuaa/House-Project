<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('房源')}"></head>
<body>
<header th:replace="~{fragments/shell :: bar('home')}"></header>
<main class="container">
    <div class="intro">
        <div>
            <p class="eyebrow">Collection</p>
            <h1>全部房源</h1>
            <p class="lede" th:if="${session.username != null}">下架后会进入回收站，可以恢复，也可以彻底清除。</p>
            <p class="lede" th:if="${session.username == null}">先看看在架的房子。登录后才能新增、编辑和下架。</p>
        </div>
        <a class="btn" th:if="${session.username != null}" th:href="@{/toaddfanzhi}">新增房源</a>
        <a class="btn" th:if="${session.username == null}" th:href="@{/login}">登录后管理</a>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(msg)}">
        <h2>还没有房源</h2>
        <p th:if="${session.username != null}">添加一套，或者去回收站把下架的房子找回来。</p>
        <p th:if="${session.username == null}">当前没有在架房源。</p>
        <a class="btn" th:if="${session.username != null}" th:href="@{/toaddfanzhi}">新增房源</a>
    </div>

    <section class="gallery" th:unless="${#lists.isEmpty(msg)}">
        <article class="listing" th:each="lists : ${msg}">
            <a class="listing-link" th:href="@{/house(hid=${lists.hid})}">
                <div class="listing-photo">
                    <img th:src="${lists.tupian}" alt="">
                    <span class="badge"
                          th:classappend="${lists.zhuangtai == '出租中'} ? ' is-rent' : ' is-sale'"
                          th:text="${lists.zhuangtai}"></span>
                    <span class="price-tag"><span th:text="${lists.jiage}"></span><small>元/平米</small></span>
                </div>
                <h3 th:text="${lists.dizhi}"></h3>
                <p class="meta"><span th:text="${lists.mianji}"></span> 平米</p>
                <p class="more">查看详情</p>
            </a>
            <div class="listing-actions" th:if="${session.username != null}">
                <a th:href="@{/goxiugai(hid=${lists.hid})}">编辑</a>
                <form th:action="@{/shanchu}" method="post">
                    <input type="hidden" name="hid" th:value="${lists.hid}">
                    <button type="submit">下架</button>
                </form>
            </div>
        </article>
    </section>
</main>
</body>
</html>
