<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房产管理系统</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app">
<div class="container">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">HP</div>
            <div>
                <h1>房产管理系统</h1>
                <p>房源清单与状态管理</p>
            </div>
        </div>
        <div class="user-chip" th:text="${msg1}"></div>
    </header>

    <nav class="nav-bar">
        <a class="nav-link" href="#">主页</a>
        <a class="nav-link" th:href="@{/toaddfanzhi}">添加房产信息</a>
        <a class="nav-link" th:href="@{/togm}">修改用户信息</a>
        <a class="nav-link" th:href="@{/gaimima1}">管理用户</a>
        <a class="nav-link" th:href="@{/zhuxiao}">注销</a>
    </nav>

    <main class="card-grid">
        <div class="house-card" th:each="lists : ${msg}">
            <div class="house-media">
                <img th:src="${lists.tupian}" alt="房源图片">
            </div>
            <div class="house-body">
                <div class="house-row">
                    <span class="label">地址</span>
                    <span class="value" th:text="${lists.dizhi}"></span>
                </div>
                <div class="house-row">
                    <span class="label">价格</span>
                    <span class="value"><span th:text="${lists.jiage}"></span>/平米</span>
                </div>
                <div class="house-row">
                    <span class="label">面积</span>
                    <span class="value"><span th:text="${lists.mianji}"></span>平米</span>
                </div>
                <div class="house-row">
                    <span class="label">状态</span>
                    <span class="status" th:text="${lists.zhuangtai}"></span>
                </div>
                <div class="house-actions">
                    <form th:action="@{/shanchu}" method="post" style="display:inline;">
                        <input type="hidden" name="hid" th:value="${lists.hid}">
                        <button type="submit" class="btn danger">删除</button>
                    </form>
                    <a th:href="@{/goxiugai(hid=${lists.hid})}" class="btn ghost" role="button">修改</a>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
