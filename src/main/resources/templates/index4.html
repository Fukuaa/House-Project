<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('用户')}"></head>
<body>
<header th:replace="~{fragments/shell :: bar('users')}"></header>
<main class="container">
    <div class="intro">
        <div>
            <p class="eyebrow">People</p>
            <h1>用户</h1>
            <p class="lede">等级 1 是管理员，等级 0 是普通用户。</p>
        </div>
    </div>
    <section class="sheet" style="width:100%; margin-top:0;">
        <table class="table">
            <thead>
            <tr>
                <th>用户</th>
                <th>等级</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${user}">
                <td th:text="${user.username}"></td>
                <td><span class="pill" th:text="${user.dengji}"></span></td>
                <td>
                    <a class="btn ghost" th:href="@{/goxiugai1(username=${user.username})}">修改</a>
                    <form th:action="@{/shan}" method="post" style="display:inline;">
                        <input type="hidden" name="username" th:value="${user.username}">
                        <button class="btn danger" type="submit">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
