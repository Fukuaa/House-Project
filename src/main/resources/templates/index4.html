<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理用户</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app">
<div class="container">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">HP</div>
            <div>
                <h1>房产管理系统</h1>
                <p>管理员中心</p>
            </div>
        </div>
        <div class="user-chip" th:text="${msg1}"></div>
    </header>

    <nav class="nav-bar">
        <a class="nav-link" th:href="@{/toindex}">主页</a>
        <a class="nav-link" th:href="@{/toaddfanzhi}">添加房产信息</a>
        <a class="nav-link" th:href="@{/togm}">修改用户信息</a>
        <a class="nav-link" href="#">管理用户</a>
        <a class="nav-link" th:href="@{/zhuxiao}">注销</a>
    </nav>

    <main class="card">
        <h2 class="card-title">用户列表</h2>
        <table class="table">
            <thead>
            <tr>
                <th>用户</th>
                <th>等级</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${user}">
                <td th:text="${user.username}"></td>
                <td><span class="pill" th:text="${user.dengji}"></span></td>
                <td>
                    <a class="btn ghost" th:href="@{/goxiugai1(username=${user.username})}">修改</a>
                    <form th:action="@{/shan}" method="post" style="display:inline;">
                        <input type="hidden" name="username" th:value="${user.username}">
                        <button class="btn danger" type="submit">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
</body>
</html>
