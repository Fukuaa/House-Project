<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('账号')}"></head>
<body>
<header th:replace="~{fragments/shell :: bar('account')}"></header>
<main class="container">
    <section class="sheet">
        <p class="eyebrow">Account</p>
        <h1>修改密码</h1>
        <p class="lede">两次输入需要一致。修改成功后需要重新登录。</p>
        <form th:action="@{/gaimima}" method="post" class="form-grid">
            <div class="field">
                <label>新密码</label>
                <input type="password" name="p1" autocomplete="new-password">
            </div>
            <div class="field">
                <label>确认密码</label>
                <input type="password" name="p2" autocomplete="new-password">
            </div>
            <p class="error" th:text="${error}"></p>
            <div class="actions">
                <button class="btn" type="submit">保存</button>
                <a class="btn ghost" th:href="@{/toindex}">返回</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
