<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房产管理系统 - 登录</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app">
<div class="container">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">HP</div>
            <div>
                <h1>房产管理系统</h1>
                <p>简单、清晰、可管理的房产展示与维护</p>
            </div>
        </div>
    </header>

    <main class="split">
        <section class="card">
            <h2 class="card-title">欢迎回来</h2>
            <p class="muted">请输入账号密码继续操作。</p>
            <form th:action="@{/login}" method="post" class="form-grid">
                <div class="field">
                    <label>账号</label>
                    <input type="text" name="username" autocomplete="username">
                </div>
                <div class="field">
                    <label>密码</label>
                    <input type="password" name="password" autocomplete="current-password">
                </div>
                <div class="error" th:text="${farmName}"></div>
                <div class="actions">
                    <button id="login_btn" class="btn" type="submit">登录</button>
                    <a class="btn ghost" th:href="@{/goZhuChe}">注册</a>
                </div>
            </form>
        </section>

        <section class="card">
            <h2 class="card-title">系统亮点</h2>
            <p class="muted">快速录入房源、集中管理用户、统一展示信息。</p>
            <div class="footer-note">建议使用 Chrome / Edge 以获得最佳体验。</div>
        </section>
    </main>
</div>
</body>
</html>
