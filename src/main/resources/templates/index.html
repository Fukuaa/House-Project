<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('登录')}"></head>
<body class="gate">
<section class="gate-visual">
    <img class="panorama" src="/images/login-hero.jpg" alt="">
    <div class="gate-caption">
        <p class="eyebrow">House Project</p>
        <h1>把每一套房<br>好好收着。</h1>
    </div>
</section>
<section class="gate-panel">
    <div class="gate-form">
        <p class="eyebrow">Sign in</p>
        <h2>欢迎回来</h2>
        <p class="lede">登录后可以管理房源，下架的内容会先进入回收站。</p>
        <form th:action="@{/login}" method="post" class="form-grid">
            <div class="field">
                <label>账号</label>
                <input type="text" name="username" autocomplete="username" placeholder="请输入账号">
            </div>
            <div class="field">
                <label>密码</label>
                <input type="password" name="password" autocomplete="current-password" placeholder="请输入密码">
            </div>
            <p class="error" th:text="${farmName}"></p>
            <button id="login_btn" class="btn" type="submit">登录</button>
        </form>
        <p class="switch">还没有账号？ <a th:href="@{/goZhuChe}">注册</a></p>
    </div>
</section>
</body>
</html>
