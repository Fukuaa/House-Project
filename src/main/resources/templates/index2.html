<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('新增房源')}"></head>
<body>
<header th:replace="~{fragments/shell :: bar('add')}"></header>
<main class="container">
    <div class="intro">
        <div>
            <p class="eyebrow">New</p>
            <h1>登记一套房子</h1>
            <p class="lede">可以一次上传多张图片，第一张作为封面。出售和出租要填写不同的详情。</p>
        </div>
    </div>
    <div class="work">
        <section class="sheet" style="margin:0;">
            <form th:action="@{/addfangzhi}" method="post" enctype="multipart/form-data" class="form-grid">
                <div class="field">
                    <label>地址</label>
                    <input type="text" name="dizhi" placeholder="例如 杭州市西湖区云栖路 18 号" th:value="${house != null ? house.dizhi : ''}">
                </div>
                <div class="field">
                    <label>面积（平米）</label>
                    <input type="number" name="mianji" placeholder="168" th:value="${house != null ? house.mianji : ''}">
                </div>
                <div class="field">
                    <label>价格（元/平米）</label>
                    <input type="number" name="jiage" placeholder="28000" th:value="${house != null ? house.jiage : ''}">
                </div>
                <div class="field">
                    <label>图片（可多选）</label>
                    <input type="file" name="files" id="fileInput" accept="image/*" multiple>
                </div>
                <div class="field">
                    <label>或再填一张图片地址</label>
                    <input type="text" name="tupian" placeholder="/images/tu.jpg">
                </div>
                <div class="field">
                    <label>状态</label>
                    <select name="zhuangtai" id="status">
                        <option value="">请选择状态</option>
                        <option th:each="st : ${statuses}" th:value="${st.label}" th:text="${st.label}"
                                th:selected="${house != null and house.zhuangtai == st.label}"></option>
                    </select>
                </div>
                <div id="sale-fields" class="detail-fields" th:classappend="${house != null and house.zhuangtai == '售卖中'} ? '' : ' is-hidden'">
                    <p class="group-label">出售详情</p>
                    <div class="field">
                        <label>装修</label>
                        <input type="text" name="zhuangxiu" placeholder="例如 精装" th:value="${house != null ? house.zhuangxiu : ''}">
                    </div>
                    <div class="field">
                        <label>产权年限</label>
                        <input type="text" name="chanquan" placeholder="例如 70 年住宅" th:value="${house != null ? house.chanquan : ''}">
                    </div>
                    <div class="field">
                        <label>物业费</label>
                        <input type="text" name="wuye" placeholder="例如 3.6 元/平米/月" th:value="${house != null ? house.wuye : ''}">
                    </div>
                </div>
                <div id="rent-fields" class="detail-fields" th:classappend="${house != null and house.zhuangtai == '出租中'} ? '' : ' is-hidden'">
                    <p class="group-label">出租详情</p>
                    <div class="field">
                        <label>家具</label>
                        <input type="text" name="jiaju" placeholder="例如 全套家具家电" th:value="${house != null ? house.jiaju : ''}">
                    </div>
                    <div class="field">
                        <label>水电费</label>
                        <input type="text" name="shuidian" placeholder="例如 租客自理，月均约 200 元" th:value="${house != null ? house.shuidian : ''}">
                    </div>
                    <div class="field">
                        <label>最低租期</label>
                        <input type="text" name="zuqi" placeholder="例如 12 个月" th:value="${house != null ? house.zuqi : ''}">
                    </div>
                </div>
                <p class="error" th:text="${error}"></p>
                <div class="actions">
                    <button class="btn" type="submit">保存</button>
                    <a class="btn ghost" th:href="@{/toindex}">返回</a>
                </div>
            </form>
        </section>
        <aside class="sheet preview-card" style="margin:0;">
            <h2>预览</h2>
            <div class="preview-frame">
                <img id="preview" src="/images/preview-house.jpg" alt="预览图">
            </div>
            <div class="preview-strip" id="preview-strip"></div>
            <p class="note">支持 JPG、PNG、GIF。按住 Ctrl 或 Shift 可以一次选多张，第一张会显示在房源卡片上。</p>
        </aside>
    </div>
</main>
<script>
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  if (fileInput) {
    fileInput.addEventListener("change", () => {
      const files = Array.prototype.slice.call(fileInput.files || []);
      const strip = document.getElementById("preview-strip");
      if (strip) strip.innerHTML = "";
      files.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          if (index === 0 && preview) preview.src = e.target.result;
          if (!strip) return;
          const img = document.createElement("img");
          img.src = e.target.result;
          img.alt = "";
          strip.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    });
  }
</script>
<script src="/js/house-form.js"></script>
</body>
</html>
