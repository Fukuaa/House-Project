<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('新增房源')}"></head>
<body>
<header th:replace="~{fragments/shell :: bar('add')}"></header>
<main class="container">
    <div class="intro">
        <div>
            <p class="eyebrow">New</p>
            <h1>登记一套房子</h1>
            <p class="lede">地址、面积和价格会显示在房源卡片上。</p>
        </div>
    </div>
    <div class="work">
        <section class="sheet" style="margin:0;">
            <form th:action="@{/addfangzhi}" method="post" enctype="multipart/form-data" class="form-grid">
                <div class="field">
                    <label>地址</label>
                    <input type="text" name="dizhi" placeholder="例如 杭州市西湖区云栖路 18 号">
                </div>
                <div class="field">
                    <label>面积（平米）</label>
                    <input type="number" name="mianji" placeholder="168">
                </div>
                <div class="field">
                    <label>价格（元/平米）</label>
                    <input type="number" name="jiage" placeholder="28000">
                </div>
                <div class="field">
                    <label>图片</label>
                    <input type="file" name="file" id="fileInput" accept="image/*">
                </div>
                <div class="field">
                    <label>或填写图片地址</label>
                    <input type="text" name="tupian" placeholder="/images/tu.jpg">
                </div>
                <div class="field">
                    <label>状态</label>
                    <select name="zhuangtai">
                        <option value="">请选择状态</option>
                        <option value="售卖中">售卖中</option>
                        <option value="出租中">出租中</option>
                        <option value="已售出">已售出</option>
                    </select>
                </div>
                <div class="actions">
                    <button class="btn" type="submit">保存</button>
                    <a class="btn ghost" th:href="@{/toindex}">返回</a>
                </div>
            </form>
        </section>
        <aside class="sheet preview-card" style="margin:0;">
            <h2>预览</h2>
            <div class="preview-frame">
                <img id="preview" src="/images/preview-house.jpg" alt="预览图">
            </div>
            <p class="note">支持 JPG、PNG、GIF，文件会保存到服务器。</p>
        </aside>
    </div>
</main>
<script>
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  if (fileInput) {
    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => { preview.src = e.target.result; };
      reader.readAsDataURL(file);
    });
  }
</script>
</body>
</html>
