<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>添加房产</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app">
<div class="container">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">HP</div>
      <div>
        <h1>房产管理系统</h1>
        <p>新增房源信息</p>
      </div>
    </div>
    <div class="user-chip" th:text="${msg1}"></div>
  </header>

  <nav class="nav-bar">
    <a class="nav-link" th:href="@{/toindex}">主页</a>
    <a class="nav-link" href="#">添加房产信息</a>
    <a class="nav-link" th:href="@{/togm}">修改用户信息</a>
    <a class="nav-link" th:href="@{/gaimima1}">管理用户</a>
    <a class="nav-link" th:href="@{/zhuxiao}">注销</a>
  </nav>

  <main class="split">
    <section class="card">
      <h2 class="card-title">添加房产</h2>
      <form th:action="@{/addfangzhi}" method="post" class="form-grid">
        <div class="field">
          <label>地址</label>
          <input type="text" name="dizhi" placeholder="请输入地址">
        </div>
        <div class="field">
          <label>面积</label>
          <input type="number" name="mianji" placeholder="请输入面积">
        </div>
        <div class="field">
          <label>价格</label>
          <input type="number" name="jiage" placeholder="请输入价格">
        </div>
        <div class="field">
          <label>图片</label>
          <input type="text" name="tupian" placeholder="例如 /images/tu.jpg">
        </div>
        <div class="field">
          <label>状态</label>
          <select name="zhuangtai">
            <option value="">请选择状态</option>
            <option value="已售出">已售出</option>
            <option value="售卖中">售卖中</option>
            <option value="出租中">出租中</option>
          </select>
        </div>
        <div class="actions">
          <button class="btn" type="submit">完成</button>
          <a class="btn ghost" th:href="@{/toindex}">返回</a>
        </div>
      </form>
    </section>

    <section class="card">
      <h2 class="card-title">录入提示</h2>
      <p class="muted">图片建议使用 /images/ 目录下的资源。</p>
      <div class="pill">推荐尺寸：1000 x 600</div>
    </section>
  </main>
</div>
</body>
</html>
