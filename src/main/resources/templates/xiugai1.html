<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改用户</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app">
<div class="container">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">HP</div>
            <div>
                <h1>修改用户</h1>
                <p>更新密码与等级</p>
            </div>
        </div>
    </header>

    <main class="split">
        <section class="card">
            <h2 class="card-title">修改用户</h2>
            <form th:action="@{/gai}" method="post" class="form-grid">
                <div class="field">
                    <label>新密码</label>
                    <input type="password" name="password" autocomplete="new-password">
                </div>
                <div class="field">
                    <label>确认密码</label>
                    <input type="password" name="passwordConfirm" autocomplete="new-password">
                </div>
                <div class="field">
                    <label>等级</label>
                    <input type="number" name="dengji" placeholder="例如 0 或 1">
                </div>
                <div class="error" th:text="${error}"></div>
                <div class="actions">
                    <button class="btn" type="submit">完成</button>
                    <a class="btn ghost" th:href="@{/gaimima1}">返回</a>
                </div>
            </form>
        </section>
        <section class="card">
            <h2 class="card-title">注意事项</h2>
            <p class="muted">管理员等级为 1，普通用户为 0。</p>
        </section>
    </main>
</div>
</body>
</html>
