<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('修改用户')}"></head>
<body>
<header th:replace="~{fragments/shell :: bar('users')}"></header>
<main class="container">
    <section class="sheet">
        <p class="eyebrow">User</p>
        <h1>修改用户</h1>
        <p class="lede">管理员等级填 1，普通用户填 0。</p>
        <form th:action="@{/gai}" method="post" class="form-grid">
            <div class="field">
                <label>新密码</label>
                <input type="password" name="password" autocomplete="new-password">
            </div>
            <div class="field">
                <label>确认密码</label>
                <input type="password" name="passwordConfirm" autocomplete="new-password">
            </div>
            <div class="field">
                <label>等级</label>
                <input type="number" name="dengji" placeholder="0 或 1">
            </div>
            <p class="error" th:text="${error}"></p>
            <div class="actions">
                <button class="btn" type="submit">保存</button>
                <a class="btn ghost" th:href="@{/gaimima1}">返回</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
