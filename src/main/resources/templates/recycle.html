<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('回收站')}"></head>
<body>
<header th:replace="~{fragments/shell :: bar('bin')}"></header>
<main class="container">
    <div class="intro">
        <div>
            <p class="eyebrow">Recycle</p>
            <h1>回收站</h1>
            <p class="lede">下架和已售出的房子都可以恢复。已售出的恢复后会变成售卖中。</p>
        </div>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(msg)}">
        <h2>回收站是空的</h2>
        <p>从房源页下架，或者已经售出的房子，会出现在这里。</p>
        <a class="btn ghost" th:href="@{/toindex}">返回房源</a>
    </div>

    <section class="gallery is-bin" th:unless="${#lists.isEmpty(msg)}">
        <article class="listing" th:each="lists : ${msg}">
            <a class="listing-link" th:href="@{/house(hid=${lists.hid})}">
                <div class="listing-photo">
                    <img th:src="${lists.tupian}" alt="">
                    <span class="badge is-sold" th:text="${lists.zhuangtai == '已售出'} ? '已售出' : '已下架'"></span>
                    <span class="price-tag"><span th:text="${lists.jiage}"></span><small>元/平米</small></span>
                </div>
                <h3 th:text="${lists.dizhi}"></h3>
                <p class="meta">
                    <span th:text="${lists.mianji}"></span> 平米
                    <span th:if="${lists.deletedAt != null}"> · <span th:text="${#dates.format(lists.deletedAt, 'yyyy-MM-dd HH:mm')}"></span></span>
                </p>
                <p class="more">查看详情</p>
            </a>
            <div class="listing-actions">
                <form th:action="@{/restore}" method="post">
                    <input type="hidden" name="hid" th:value="${lists.hid}">
                    <button type="submit">恢复</button>
                </form>
                <form th:action="@{/purge}" method="post" onsubmit="return confirm('彻底删除后无法恢复，确定吗？');">
                    <input type="hidden" name="hid" th:value="${lists.hid}">
                    <button class="danger" type="submit">彻底删除</button>
                </form>
            </div>
        </article>
    </section>
</main>
</body>
</html>
